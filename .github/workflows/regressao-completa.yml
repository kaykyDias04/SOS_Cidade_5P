name: regressao-completa

# Suíte completa (unitários, API e todos os E2E) contra a stack inteira.
# Roda todo dia às 03:00 de Brasília (06:00 UTC; o cron do GitHub é sempre em UTC)
# e sob demanda pelo botão "Run workflow". O agendamento só vale com este arquivo na main.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Evita gastar recursos em regressões antigas da mesma branch.
concurrency:
  group: regressao-completa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write # abrir issue automática quando a regressão falha

jobs:
  regressao-completa:
    name: regressao-completa
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: soscidade
          POSTGRES_HOST_AUTH_METHOD: trust # banco descartável do job, sem senha
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 12

    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres@localhost:5432/soscidade
      DIRECT_URL: postgresql://postgres@localhost:5432/soscidade
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_API_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/subir-stack

      - name: Validar política de gestão de testes
        run: npm run test:management:validate

      # Frontend e backend em passos separados: se um falhar, o outro roda mesmo
      # assim e o seu XML não fica faltando nas métricas.
      - name: Testes unitários (frontend)
        run: npm run test:unit:frontend

      - name: Testes unitários (mobile)
        if: ${{ !cancelled() }}
        run: npm ci --prefix mobile

      - name: Executar testes unitários (mobile)
        if: ${{ !cancelled() }}
        run: npm run test:unit:mobile

      - name: Testes unitários (backend)
        if: ${{ !cancelled() }}
        run: npm run test:unit:backend

      - name: Testes de API (com cobertura)
        if: ${{ !cancelled() }}
        run: npm run test:coverage

      - name: Testes End-to-End (E2E)
        if: ${{ !cancelled() }}
        run: npm run test:e2e

      - name: Registrar testes instáveis da regressão
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/registrar-flaky
        with:
          arquivo: resultados/flaky-e2e.json

      - name: Testes em quarentena (falhas isoladas)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          QUARANTINE_RETRIES: ${{ vars.QUARANTINE_RETRIES || '2' }}
          E2E_JUNIT_FILE: resultados-quarentena/e2e.xml
          E2E_FLAKY_FILE: resultados-quarentena/flaky-e2e.json
          PLAYWRIGHT_HTML_REPORT: resultados-quarentena/playwright-report
        run: npm run test:quarantine -- frontend backend api e2e

      - name: Relatório de gestão dos testes
        if: ${{ !cancelled() }}
        run: npm run test:review

      - name: Salvar quarentena e revisão separadamente
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gestao-quarentena
          path: relatorios/
          retention-days: 30

      - name: Registrar testes instáveis da quarentena
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/registrar-flaky
        with:
          arquivo: resultados-quarentena/flaky-e2e.json

      # Sobe sempre, verde ou vermelho: XMLs, relatórios da gestão de testes,
      # resultados separados da quarentena e logs gerados pela action subir-stack.
      - name: Salvar resultados dos testes
        id: artefato
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: resultados-testes
          path: |
            resultados/
            resultados-quarentena/
            relatorios/
            backend/backend.log
            frontend/frontend.log
            e2e/playwright-report/
          retention-days: 30
          overwrite: true

      # Sobe artefato dedicado com relatórios de cobertura (HTML e LCOV)
      - name: Salvar relatório de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-cobertura
          path: |
            resultados/cobertura/
            coverage/
          retention-days: 30
          overwrite: true

      - name: Gerar relatórios de qualidade e métricas
        if: ${{ !cancelled() }}
        uses: ./.github/actions/gerar-relatorios
        with:
          pasta-xml: resultados/

      # Falha de madrugada ninguém vê: abre issue (ou comenta na que já está aberta).
      - name: Abrir issue de falha
        if: ${{ failure() }}
        uses: ./.github/actions/abrir-issue-falha
        with:
          artefato-url: ${{ steps.artefato.outputs.artifact-url }}
