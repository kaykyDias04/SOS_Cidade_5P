name: regressao-completa

# Suíte completa (unitários, API e todos os E2E) contra a stack inteira.
# Roda todo dia às 03:00 de Brasília (06:00 UTC; o cron do GitHub é sempre em UTC)
# e sob demanda pelo botão "Run workflow". O agendamento só vale com este arquivo na main.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write # abrir issue automática quando a regressão falha

jobs:
  regressao-completa:
    name: regressao-completa
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: soscidade
          POSTGRES_HOST_AUTH_METHOD: trust # banco descartável do job, sem senha
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/soscidade
      DIRECT_URL: postgresql://postgres@localhost:5432/soscidade
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_API_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/subir-stack

      # Frontend e backend em passos separados: se um falhar, o outro roda mesmo
      # assim e o seu XML não fica faltando nas métricas.
      - name: Testes unitários (frontend)
        run: npm run test:unit:frontend

      - name: Testes unitários (backend)
        if: ${{ !cancelled() }}
        run: npm run test:unit:backend

      - name: Testes de API
        if: ${{ !cancelled() }}
        run: npm run test:api

      - name: Testes End-to-End (E2E)
        if: ${{ !cancelled() }}
        run: npm run test:e2e

      # Sobe sempre, verde ou vermelho: XML de todas as suítes, logs do backend e do
      # frontend (gerados pela action subir-stack) e o relatório HTML do E2E.
      - name: Salvar resultados dos testes
        id: artefato
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: resultados-testes
          path: |
            resultados/
            backend/backend.log
            frontend/frontend.log
            e2e/playwright-report/
          retention-days: 30
          overwrite: true

      # Falha de madrugada ninguém vê: abre issue (ou comenta na que já está aberta).
      - name: Abrir issue de falha
        if: ${{ failure() }}
        uses: ./.github/actions/abrir-issue-falha
        with:
          artefato-url: ${{ steps.artefato.outputs.artifact-url }}
