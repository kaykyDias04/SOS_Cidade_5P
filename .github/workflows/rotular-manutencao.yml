name: rotular-manutencao

# Aplica as labels falha:*, prioridade:* e flaky a partir do formulário de manutenção.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: rotular-manutencao-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  rotular:
    if: contains(github.event.issue.body, '### Tipo de falha')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Sincronizar labels
        run: node .github/scripts/rotular-manutencao.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
