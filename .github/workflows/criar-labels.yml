name: criar-labels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/criar-labels.sh

permissions:
  contents: read
  issues: write

jobs:
  criar-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Criar labels padronizadas
        run: bash .github/scripts/criar-labels.sh
        env:
          GH_TOKEN: ${{ github.token }}
